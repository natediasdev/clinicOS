<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1e38"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="256" y1="100" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="crossGradH" x1="100" y1="256" x2="412" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="107" stroke="#1e3a5f" stroke-width="3" fill="none"/>

  <!-- Glow azul de fundo -->
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="#1d4ed8" opacity="0.08"/>

  <!-- Braço vertical -->
  <rect x="212" y="106" width="88" height="300" rx="20" fill="url(#crossGrad)" filter="url(#glow)"/>

  <!-- Braço horizontal -->
  <rect x="106" y="212" width="300" height="88" rx="20" fill="url(#crossGradH)" filter="url(#glow)"/>

  <!-- Reflexo de luz no topo do ícone -->
  <ellipse cx="180" cy="140" rx="60" ry="20" fill="white" opacity="0.05" transform="rotate(-35 180 140)"/>
</svg>
